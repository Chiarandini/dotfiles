# ~/.config/tmux/tmux.conf
#
# tmux owns projects (sessions), work units (windows), and persistence.
# There are no panes by design: nvim owns splitting.
#
#   session = project      pg/constellation, tb/etale-cohomology
#     window = unit/role   etale-cohomology/nvim, serve/web
#
# Companion scripts: ~/.config/tmux/bin/. Registries: roots.tsv, serves.tsv.

# ------------------------------------------------------------------- core

set  -g default-terminal "tmux-256color"

# Set the whole array, never append. Both `set -ga terminal-overrides` and
# `set -as terminal-features` append on every reload, so sourcing this file N
# times left N copies of the same entry. The first three are tmux's own
# defaults, restated so this assignment is complete and idempotent.
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-kitty:RGB:extkeys'

# Modified keys. Without this, tmux reports "only standard keys" and
# Shift+Enter arrives indistinguishable from Enter, which breaks Claude's
# multi-line input and nvim's S-CR mappings. The extkeys terminal-feature
# above is the other half: it tells tmux kitty supports extended keys.
#
# This MUST be `on`, not `always`. With extended-keys enabled, Neovim's
# TermResponse autocmd stops firing, so terminal query replies leak into the
# buffer as literal text (snacks.nvim issue 2332). snacks works around that,
# but its check is a literal match on " on$"
# (snacks/image/terminal.lua:259), so `always` silently defeats the
# workaround and you get `kitty(0.46.0)` typed into your buffer.
set -s extended-keys on
set -s extended-keys-format csi-u
set  -g history-limit 50000
set  -sg escape-time 10
set  -g focus-events on
set  -g mouse on
setw -g mode-keys vi

# Drag-selected text reaches the macOS clipboard via OSC 52, and applications
# inside a pane can set tmux buffers the same way. With mouse on, tmux grabs
# the mouse; hold Shift to bypass it and use kitty's own selection instead
# (kitty default: mouse_map shift+left click grabbed,ungrabbed).
set  -g set-clipboard on
set  -g base-index 1
set  -g renumber-windows on
set  -g detach-on-destroy off

# The server must survive having zero sessions, or `tmux start-server` after a
# reboot exits before continuum has finished restoring into it.
set  -g exit-empty off

# Window names follow the unit/role convention and nothing else may rewrite
# them: not tmux's own heuristics, not an application title escape.
setw -g automatic-rename off
setw -g allow-rename off

# Bell. This path was dead until preferredNotifChannel was set in
# ~/.claude/settings.json; kitty was always configured correctly.
# bell-action any propagates a bell from any window of the attached session.
setw -g monitor-bell on
set  -g visual-bell off
set  -g bell-action any

# Forward the project name to kitty's title.
# Escape cancels the rename prompt. tmux infers status-keys from $EDITOR and
# had picked vi, where Escape only leaves the prompt's insert mode.
set -g status-keys emacs

# Bubble the session's most urgent state up to the kitty tab: attention beats
# working beats ready beats editing.
#
# @state is computed by bin/session-state.sh, not in this format. It used to be
# a #{W:...} loop here, and that was quietly wrong: strftime does not reach
# inside a loop body, so the `%s` supplying "now" expanded to nothing, every
# window's age computed as 0, and every session read as permanently working.
# The per-window bar below is unaffected because it does not loop.
set -g set-titles on
set -g set-titles-string "#{@state}#S"

# ----------------------------------------------------------------- keymap
#
# One global chord. kitty maps cmd+k to this byte; see kitty.conf.
# The menu is the interface: read it while learning, type straight through
# it once the fingers know. Nothing has to be memorised.

set -g prefix None
unbind -a -T prefix

# Do NOT `unbind -a -T root`. Every mouse binding tmux has lives in the root
# table (19 of them, all Mouse*/Wheel*), including MouseDown1Status, which is
# what makes clicking a window in the status line select it. Wiping the table
# leaves `mouse on` reporting events that nothing handles, so the mouse looks
# dead. The four bindings below are added to the defaults, and none of them
# collide.

# The menu binding is GENERATED from actions.tsv into menu.generated.tmux, so
# actions are still defined in exactly one place while the keypress path stays
# pure tmux. Binding this to `run-shell menu.sh` instead cost 126 ms of fork,
# source and file-read before the menu could be drawn, which is long enough
# that a quickly typed second key landed in the pane instead of the menu.
# Regenerate after editing actions.tsv: bin/menu.sh generate > menu.generated.tmux
source-file ~/.config/tmux/menu.generated.tmux

# Motions, no prefix. kitty sends these; they keep their vim directions.
# cmd+h / cmd+l are siblings, cmd+j is last-used, cmd+k goes up a layer.
bind -T root M-h previous-window
bind -T root M-l next-window
bind -T root M-j last-window

# Move the current window within its session (cmd+, / cmd+.). The target must
# be the bare relative form: `-t -1`, never `-t <session>:-1`. With a session
# prefix tmux does not read it as relative and will happily swap a window
# ACROSS sessions instead, which is a silent and confusing data shuffle.
bind -T root M-H swap-window -d -t -1
bind -T root M-L swap-window -d -t +1

# Freshly created sessions launch their programs here rather than at creation
# time, because a session with no client has 80x24 windows. See bin/bootstrap.sh.
set-hook -g client-attached 'run-shell "~/.config/tmux/bin/bootstrap.sh"'

# Record which window actually rang, so a bell appearing somewhere unexpected
# is answerable from the log instead of from memory.
set-hook -g alert-bell 'run-shell "~/.config/tmux/bin/log-event.sh bell"'

# serves.tsv is keyed by session name, so renaming a project detaches it from
# its declared servers. This fires only on rename and only says anything when
# a declared session is missing AND its directory is open under another name,
# so an unopened project stays silent.
set-hook -g session-renamed 'run-shell "~/.config/tmux/bin/serve.sh check"'

# vi copy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ----------------------------------------------------------------- visual
#
# Glyph and colour ported from taborg/tabbar.py:25-76, so the vocabulary
# read for the last two months carries over unchanged. Precedence is
# parked > bell > working > ready, then nvim, then plain.
# No #() shell callouts: this is redrawn on every status tick.

set -g status on
# 2s: the working glyph is static, not an animated spinner, and its underlying
# test is a 3-second activity window, so a 1s tick bought nothing and doubled
# the cost of the session-state callout below.
set -g status-interval 2
set -g status-position top
set -g status-justify left
set -g status-style "bg=#0d1117,fg=#8b949e"

set -g status-left "#[bg=#e6edf3,fg=#0d1117,bold] #S #[default] "
set -g status-left-length 40

# The #() call is for its side effect: it refreshes @state each interval and
# prints nothing. Piggybacking on the status redraw avoids a second timer.
set -g status-right "#(~/.config/tmux/bin/session-state.sh)#[fg=#8b949e]#{continuum_status} #[fg=#8b949e]%a %H:%M "
set -g status-right-length 60

set -g window-status-separator ""

# The claude test reads @claude rather than looking at the process itself. No
# process-name match can work here: depending on the install tmux reports
# claude, claude.exe, or the bare version string of a re-execed binary such as
# 2.1.251, and that last one made every recently started Claude window fall
# through to the blue shell branch. bin/session-state.sh decides it once, from
# the marker Claude keeps at the head of the pane title, and publishes it.
# Shell and other windows get their own blue and a › marker, so a plain
# terminal reads as a deliberate thing rather than as absence. Parked keeps
# the grey; the two are no longer the same colour.
# "Claude is working" cannot come from the title: Claude keeps a static
# "✳ <topic>" there whether idle or busy, and its internal busy state is only
# published to the terminal tab behind a server-side feature gate that is off.
# Verified by sampling a real run: the title never changed, byte for byte.
#
# It is derived from output instead, but not in this format: a single repaint
# counts as output, so focusing a tab made it flash yellow. bin/session-state.sh
# publishes @working after seeing output in two consecutive samples, which a
# one-shot repaint never reaches.
set -g window-status-format "#{?#{==:#{@parked},1},#[fg=#8B949E]▸ ,#{?#{window_bell_flag},#[fg=#F24E4E]! ,#{?#{==:#{@claude},1},#{?#{==:#{@working},1},#[fg=#F2D44E]⠿ ,#[fg=#F08C3A]✳ },#{?#{m:nvim*,#{pane_current_command}},#[fg=#4FC04F]✎ ,#[fg=#79C0FF]› }}}}#W  "

set -g window-status-current-format "#[bg=#21262d]#{?#{==:#{@parked},1},#[fg=#8B949E]▸ ,#{?#{window_bell_flag},#[fg=#F24E4E]! ,#{?#{==:#{@claude},1},#{?#{==:#{@working},1},#[fg=#F2D44E]⠿ ,#[fg=#F08C3A]✳ },#{?#{m:nvim*,#{pane_current_command}},#[fg=#4FC04F]✎ ,#[fg=#79C0FF]› }}}}#[fg=#e6edf3]#W  #[default]"

set -g message-style "bg=#0d1117,fg=#F08C3A"
set -g mode-style "bg=#e6edf3,fg=#0d1117"

# ------------------------------------------------------------ persistence

# No plugin manager. TPM is not used: the vendored copy reads only
# /etc/tmux.conf and ~/.tmux.conf (plugin_functions.sh:19), so it could never
# see this file, found zero plugins, and left resurrect inert since 2023.
# Two plugins do not need a package manager; they are git clones under
# plugins/ and update with `git -C <dir> pull`.

# Scrollback comes back too, which is what makes a restored serve window
# useful rather than merely present.
set -g @resurrect-capture-pane-contents 'on'

# nvim restores through the nvs wrapper, which loads persistence.nvim's
# session for the restored cwd. claude resumes the conversation for its cwd.
# Servers are deliberately absent: restoring the window and its name tells
# you what should be running, and starting is one keystroke.
set -g @resurrect-processes '"~nvim->nvs" "~claude->claude --continue"'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Observability: without this there is no way to tell whether saves are
# actually happening, which is the whole reason to trust the system.
# Read it with cmd+k L, or tail ~/.local/state/tmux/events.log.
# Hook values are run as shell commands by resurrect, not as tmux commands.
set -g @resurrect-hook-post-save-all   '~/.config/tmux/bin/log-event.sh saved'
set -g @resurrect-hook-pre-restore-all '~/.config/tmux/bin/log-event.sh restoring'

run '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
run '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'
