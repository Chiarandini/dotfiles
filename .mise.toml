[tools]
# The format is "plugin = version"
# "latest" will grab the newest stable release.
# You can also lock these to specific versions, e.g., "node = 20"

node = "latest"
python = ["3.11", "3.10"] # Installs both, 3.11 will be the primary global default
ruby = "latest"
go = "latest"
java = "latest"
julia = "latest"
kotlin = "latest"
php = "latest"

# Rust is deliberately absent: rustup owns it (see install.sh).
# mise does not install Rust, it symlinks its "install" to ~/.cargo/bin and
# exports RUSTUP_TOOLCHAIN=<frozen version>. That env var outranks both
# `rustup default` and any project's rust-toolchain.toml, so pinning a
# project to a channel silently does nothing while mise manages Rust.

[settings]
# Recommended: Tells mise to strictly use its own plugins or asdf plugins
experimental = false
