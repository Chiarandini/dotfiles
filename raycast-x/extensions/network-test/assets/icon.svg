<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Speedometer arc -->
  <path d="M 96 320 A 160 160 0 0 1 416 320"
        fill="none" stroke="#1F2937" stroke-width="36" stroke-linecap="round"/>

  <!-- Tick segments along arc -->
  <path d="M 96 320 A 160 160 0 0 1 192 184"
        fill="none" stroke="#10B981" stroke-width="36" stroke-linecap="round"/>
  <path d="M 192 184 A 160 160 0 0 1 320 184"
        fill="none" stroke="#F59E0B" stroke-width="36" stroke-linecap="round"/>
  <path d="M 320 184 A 160 160 0 0 1 416 320"
        fill="none" stroke="#EF4444" stroke-width="36" stroke-linecap="round"/>

  <!-- Needle: pointing up-right (~65 degrees from horizontal) -->
  <g transform="translate(256 320) rotate(-30)">
    <rect x="-6" y="-150" width="12" height="160" rx="6" fill="url(#needle)"/>
    <circle cx="0" cy="0" r="22" fill="#0F172A" stroke="#22D3EE" stroke-width="6"/>
  </g>

  <!-- Up/Down chevrons -->
  <g fill="#22D3EE">
    <path d="M 148 400 l 24 -28 l 24 28 z"/>
  </g>
  <g fill="#A78BFA">
    <path d="M 340 372 l 24 28 l 24 -28 z"/>
  </g>
</svg>
